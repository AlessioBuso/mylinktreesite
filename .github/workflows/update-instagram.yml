name: Update Instagram gallery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser scraper
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Scrape latest Instagram media
        run: npm run scrape:instagram
        env:
          IG_USERNAME: buso_design
          IG_POST_LIMIT: 5

      - name: Commit gallery data
        run: |
          if git diff --quiet -- assets/data/instagram.json themes/custom/assets/data/instagram.json assets/images/instagram themes/custom/assets/images/instagram; then
            echo "No Instagram changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/instagram.json themes/custom/assets/data/instagram.json assets/images/instagram themes/custom/assets/images/instagram
          git commit -m "chore: scrape Instagram gallery"
          git push
