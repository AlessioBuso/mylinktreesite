<!doctype html>
<html lang="{{.Config.Meta.Lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{.Config.Meta.Description}}" />
    <title>{{.Config.Meta.Title}}</title>
    <meta name="author" content="{{.Config.Meta.Author}}" />
    <meta name="theme-color" content="#141213" />
    <link rel="canonical" href="{{.Config.Meta.SiteURL}}" />
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
    <link rel="preload" href="assets/fonts/font_title.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/font_body.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <meta property="og:title" content="{{.Config.Meta.Title}}" />
    <meta property="og:description" content="{{.Config.Meta.Description}}" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="{{.Config.Meta.SiteURL}}" />
    <meta property="og:image" content="https://alessiobuso.github.io/mylinktreesite/assets/images/og-image.png" />
    <meta property="og:image:alt" content="Logo Alessio Buso" />
    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{.Config.Meta.Title}}" />
    <meta name="twitter:description" content="{{.Config.Meta.Description}}" />
    <meta name="twitter:image" content="https://alessiobuso.github.io/mylinktreesite/assets/images/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "name": "Alessio Buso | Graphic Designer & Visual Creator",
        "url": "https://alessiobuso.github.io/mylinktreesite/",
        "mainEntity": {
          "@type": "Person",
          "name": "Alessio Buso",
          "jobTitle": "Graphic Designer & Visual Creator",
          "image": "https://alessiobuso.github.io/mylinktreesite/assets/images/og-image.png",
          "sameAs": [
            "https://www.instagram.com/buso_design/",
            "https://www.linkedin.com/in/alessiobuso/"
          ]
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Vai al contenuto</a>
    <div class="loader" aria-hidden="true">
      <div class="loader__inner">
        <img class="loader__logo" src="{{.Config.Picture}}" alt="" width="240" height="134" />
        <div class="loader__dots"><span></span><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="intro-insult" aria-hidden="true"><span class="intro-insult__emoji">🖕</span><span>VAFFANCULO BUSO</span></div>
    <div class="page-shell">
      <header class="hero" data-tilt-card data-reveal>
        <div class="hero__card">
          <img class="hero__logo" src="{{.Config.Picture}}" alt="Logo Alessio Buso" width="680" height="379" fetchpriority="high" />
        </div>
      </header>
      <main id="main-content">
        <section class="profile" aria-labelledby="profile-title" data-reveal>
          <h1 id="profile-title" data-typing-title><span class="typing-title-full">{{.Config.Name}}</span><span class="typing-title-typed" aria-hidden="true"></span></h1>
          <p class="profile__bio">{{.Config.Bio}}</p>
        </section>
        <nav class="social-row" aria-label="Profili social" data-reveal>
          <a class="social-link" href="https://www.instagram.com/buso_design/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <img class="social-icon" src="assets/images/brand/IG.svg" alt="" width="34" height="34" />
          </a>
          <a class="social-link" href="https://www.linkedin.com/in/alessiobuso/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <img class="social-icon" src="assets/images/brand/IN.svg" alt="" width="34" height="34" />
          </a>
        </nav>
        <section class="projects" aria-labelledby="projects-title" data-reveal>
          <h2 id="projects-title" class="sr-only">Progetti</h2>
          <div class="project-list">
            {{range .Config.Projects}}
            <a class="project-card {{.Class}}" href="{{.URL}}" target="_blank" rel="noopener noreferrer" aria-label="{{.Name}}">
              <span class="project-card__logo"><img src="{{.Logo}}" alt="{{.Alt}}" width="120" height="80" /></span>
              {{if ne .Name "ABBO"}}<span class="project-card__name">{{.Name}}</span>{{end}}
            </a>
            {{end}}
          </div>
        </section>
        <section class="instagram" aria-labelledby="instagram-title" data-reveal>
          <h2 id="instagram-title" data-typing-title><span class="typing-title-full">Instagram</span><span class="typing-title-typed" aria-hidden="true"></span></h2>
          <div class="instagram-feed" data-instagram-feed aria-live="polite">
            <div class="instagram-empty" data-instagram-empty>
              <p>Guarda gli ultimi lavori e gli esperimenti visivi di Alessio.</p>
              <a class="instagram-cta" href="{{.Config.InstagramURL}}" target="_blank" rel="noopener noreferrer">Seguimi su Instagram <span aria-hidden="true">↗</span></a>
            </div>
          </div>
        </section>
      </main>
      <footer data-reveal><small>Made with ❤️ and 🍕 by <a href="https://alessiobellan.it" target="_blank" rel="noopener noreferrer">Alessio Bellan</a></small></footer>
    </div>
    <script src="assets/js/script.js"></script>
  </body>
</html>
